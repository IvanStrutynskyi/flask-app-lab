{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<style>
    .profile-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        font-family: Arial, sans-serif;
    }

    .profile-header {
        background-color: #007bff;
        color: #fff;
        padding: 10px;
        text-align: center;
        margin-bottom: 20px;
        border-radius: 5px;
    }

    .profile-header h1 {
        margin: 0;
        font-size: 1.5em;
    }

    .profile-header span {
        font-weight: bold;
    }

    .logout-btn {
        display: inline-block;
        margin-top: 10px;
        color: #fff;
        background-color: #dc3545;
        padding: 5px 10px;
        border-radius: 5px;
        text-decoration: none;
    }

    .cookie-section {
        margin-bottom: 20px;
    }

    .cookie-section h2 {
        color: #007bff;
        font-size: 1.2em;
    }

    .cookie-section form input[type="text"],
    .cookie-section form input[type="number"] {
        padding: 8px;
        margin: 5px 0;
        width: calc(33.333% - 10px);
        box-sizing: border-box;
    }

    .cookie-section form button {
        padding: 8px 15px;
        background-color: #28a745;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .cookie-section .delete-all-btn {
        background-color: #dc3545;
        margin-top: 10px;
    }

    .cookie-section form button:hover {
        background-color: #218838;
    }

    .cookie-section .delete-all-btn:hover {
        background-color: #c82333;
    }

    .cookie-table {
        width: 100%;
        border-collapse: collapse;
    }

    .cookie-table th,
    .cookie-table td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: left;
    }

    .cookie-table th {
        background-color: #f8f9fa;
        font-weight: bold;
    }
</style>

<div class="profile-container">
    <header class="profile-header">
        <h1>Ласкаво просимо до сторінки <span>{{ username }}</span></h1>
        <a class="logout-btn" href="{{ url_for('user_name.logout') }}">Вийти</a>
    </header>

    <section class="cookie-section">
        <h2>Додати куку:</h2>
        <form method="post">
            <input type="text" name="cookie_key" placeholder="Ключ куки" required>
            <input type="text" name="cookie_value" placeholder="Значення куки" required>
            <input type="number" name="cookie_expiry" placeholder="Термін дії (в секундах)" required>
            <button type="submit" name="action" value="add">Додати куку</button>
        </form>
    </section>

    <section class="cookie-section">
        <h2>Видалити куку:</h2>
        <form method="post">
            <input type="text" name="cookie_key" placeholder="Ключ куки для видалення" required>
            <button type="submit" name="action" value="delete">Видалити куку за ключем</button>
        </form>
    </section>

    <section class="cookie-section">
        <h2>Список всіх кук:</h2>
        <table class="cookie-table">
            <tr>
                <th>Ключ</th>
                <th>Значення</th>
            </tr>
            {% for key, value in cookies.items() %}
            <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </table>
        <form method="post">
            <button type="submit" name="action" value="delete_all" class="delete-all-btn">Видалити всі куки</button>
        </form>
    </section>
</div>
{% endblock %}
